name: Prove direct official discovery on standard cloud desktops
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-government-discovery-proof
  cancel-in-progress: false
jobs:
  official-discovery:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            channel: msedge
          - runner: macos-15-intel
            channel: chrome
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    steps:
      - name: Read public source proof
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install fixed official browser library
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Discover the full official catalog and download its original Excel files
        env:
          MOH_BROWSER_CHANNEL: ${{ matrix.channel }}
        run: node discovery-platform-proof.mjs
