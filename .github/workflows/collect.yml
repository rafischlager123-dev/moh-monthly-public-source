name: Collect original public monthly Excel sources
on:
  workflow_dispatch:
    inputs:
      test_visible_hold:
        description: 'Test a visible source Hold without collecting or replacing the last good package'
        type: boolean
        default: false
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: public-monthly-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read public collector code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify public Ready and Hold transport rules
        run: node --test source-attempt.test.mjs
      - name: Install fixed public original-file registration reader
        if: inputs.test_visible_hold != true
        run: python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 et_xmlfile==2.0.0
      - name: Collect original Excel files and a complete stable public registry
        if: inputs.test_visible_hold != true
        run: node collector.mjs
      - name: Intentional public source Hold test
        if: inputs.test_visible_hold == true
        run: node -e "throw new Error('Intentional public-source Hold acceptance test')"
      - name: Publish public source data in one commit
        if: success() && inputs.test_visible_hold != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node publish.mjs
      - name: Record a visible source Hold and keep the last good package
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node source-attempt.mjs held
