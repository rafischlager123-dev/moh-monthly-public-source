name: Prove public HTTPS discovery and independent coverage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: directory-record-coverage-proof
  cancel-in-progress: false
jobs:
  source-proof:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read public source proof
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install fixed public workbook reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 et_xmlfile==2.0.0
      - name: Discover, download, and independently reconcile public sources
        run: node directory-reconciliation-proof.mjs
