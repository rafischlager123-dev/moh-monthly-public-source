name: Public monthly source access test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-access-test
  cancel-in-progress: false
jobs:
  source-access:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read public-source test code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install the fixed official browser library
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Test official listing, exact Excel downloads and registry access
        run: node probe.mjs
